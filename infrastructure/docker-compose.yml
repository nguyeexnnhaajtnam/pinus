name: pinus-local

services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy infrastructure/.env.example to infrastructure/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infrastructure/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pinus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pinus_postgres_data:
